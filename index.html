<head>
    <meta charset="UTF-8">

    <style>
        /* --- RESET & BASE --- */
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        /* --- BUTTON CONTAINER: FLEX + WRAP → same size always --- */
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            max-width: 100%;
            margin: 0 auto;
            padding: 10px 0;
        }

        /* --- BUTTON: FIXED 150×150 ON ALL DEVICES --- */
        .button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 150px;
            height: 150px;
            flex: 0 0 150px;
            background: linear-gradient(145deg, #000, #000);
            border: 1.75px solid white;
            border-radius: 15px;
            padding: 10px;
            color: white;
            font-size: 14px;
            text-decoration: none;
            position: relative;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: transparent;
            transition: left 0.5s;
        }

        .button:hover::before {
            left: 100%;
        }

        .button:hover {
            transform: translateY(-5px) scale(1.02);
        }

        .button:active {
            transform: translateY(-2px) scale(0.98);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        /* الصورة داخل الزر */
        .button img {
            width: 70%;
            height: 70%;
            object-fit: cover;
            border-radius: 10px;
            transition: all 0.3s ease;
            opacity: 0;
        }

        .button:hover img {
            transform: scale(1.05);
        }

        .button img.loaded {
            opacity: 1;
        }

        /* تأثير الهيكل العظمي (Skeleton) */
        .button img.skeleton-img {
            background: linear-gradient(110deg, #2a2a2a 8%, #3a3a3a 18%, #2a2a2a 33%);
            background-size: 200% 100%;
            animation: shimmer 1.5s linear infinite;
            opacity: 0.7;
            border-radius: 10px;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        /* النص السفلي للزر */
        .button-text {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.5px;
            line-height: 1.4;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
            pointer-events: none;
        }

        /* --- POPUPS --- */
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .popup-content {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            color: white;
            padding: 30px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            border: 2px solid #333;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            animation: popupAppear 0.3s ease-out;
        }

        .popup-content * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        @keyframes popupAppear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .popup-content::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: #333;
            border-radius: 20px;
            z-index: -1;
        }

        .popup button {
            background: #2a2a2a;
            color: white;
            font-size: 16px;
            padding: 15px 25px;
            width: 180px;
            height: 60px;
            border: 2px solid #444;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .popup button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: transparent;
            transition: left 0.5s;
        }

        .popup button:hover::before {
            left: 100%;
        }

        .popup button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.4);
        }

        .popup button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .popup-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .popup-close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 480px) {
            .button-container {
                gap: 12px;
                padding: 5px 0;
            }

            .button {
                width: 150px;
                height: 150px;
                flex: 0 0 150px;
            }

            .button-text {
                font-size: 11px;
                bottom: 6px;
            }
        }

        @media (max-width: 380px) {
            .button-container {
                gap: 10px;
            }

            .button {
                width: 140px;
                height: 140px;
                flex: 0 0 140px;
                padding: 8px;
            }

            .button-text {
                font-size: 10px;
                bottom: 4px;
            }
        }

        .popup-content {
            -webkit-touch-callout: none;
        }
    </style>
</head>

    <script>
        // --- POPUP FUNCTIONS ---
        function openPopup() {
            document.getElementById("popup").style.display = "flex";
        }

        function openSecondPopup() {
            document.getElementById("popup2").style.display = "flex";
        }

        function openAPopup() {
            document.getElementById("popup3").style.display = "flex";
        }

        function closePopup(popupId) {
            document.getElementById(popupId).style.display = "none";
        }

        // Close popup when clicking outside
        window.onclick = function(event) {
            const popups = ['popup', 'popup2', 'popup3'];
            popups.forEach(popupId => {
                const popup = document.getElementById(popupId);
                if (event.target === popup) {
                    popup.style.display = "none";
                }
            });
        }

        // --- منع النسخ واليمين كليك في البوب أب ---
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.popup-content').forEach(popup => {
                popup.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    return false;
                });
                popup.addEventListener('copy', (e) => {
                    e.preventDefault();
                    return false;
                });
                popup.addEventListener('cut', (e) => {
                    e.preventDefault();
                    return false;
                });
            });

            // --- SKELETON SCREEN للصور ---
            const allImages = document.querySelectorAll('.button img');

            function applySkeleton(img) {
                img.classList.add('skeleton-img');
                img.style.opacity = '0';
            }

            function removeSkeleton(img) {
                img.classList.remove('skeleton-img');
                img.classList.add('loaded');
                img.style.opacity = '1';
            }

            allImages.forEach(img => {
                applySkeleton(img);
                if (img.complete) {
                    removeSkeleton(img);
                } else {
                    img.addEventListener('load', function() {
                        removeSkeleton(img);
                    });
                    img.addEventListener('error', function() {
                        img.classList.remove('skeleton-img');
                        img.style.opacity = '0.5';
                    });
                }
            });
        });

        // --- تأثير ظهور الصفحة ---
        window.addEventListener("load", function() {
            document.body.style.opacity = "1";
        });
    </script>

</body>
</html>
